name: inventory-manager

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory_dev
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_local_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db_test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory_test
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_local_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: