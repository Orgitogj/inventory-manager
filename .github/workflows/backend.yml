name: Backend

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/backend.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    name: Lint, tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://inventory:ci_throwaway_password@localhost:5432/inventory_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: ci_throwaway_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.14"

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Run tests
        run: uv run --frozen python -m pytest -q -p no:cacheprovider

      - name: Check migrations match the models
        run: uv run --frozen alembic check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
